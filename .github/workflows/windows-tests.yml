name: Windows tests

on:
  pull_request:
  push:
    branches: [main, feature/rockbox-database-backups]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run database and desktop dialog tests
        run: python -m unittest discover -s tests -v
