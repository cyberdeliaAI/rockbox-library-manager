name: Native downloads

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach downloads to (empty = artifacts only)"
        required: false
        default: ""
      sign_macos:
        description: "Sign and notarize macOS test artifacts (leave tag empty to avoid publishing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.target, 'macos-') && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04
            target: linux-x64
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
      RLM_REQUIRE_FFMPEG: "1"
      RLM_TEST_OVERLAY_PROBE: "1"
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'macos-arm64' && '11.0' || matrix.target == 'macos-x64' && '10.13' || '' }}
      SIGN_MACOS: ${{ startsWith(matrix.target, 'macos-') && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.sign_macos || inputs.tag != ''))) && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt "ruff>=0.11,<1"
      - name: Preserve macOS compatibility for NumPy
        if: runner.os == 'macOS' && hashFiles('scripts/prepare_macos_numpy.py') != ''
        run: python scripts/prepare_macos_numpy.py
      - name: Install FFmpeg and display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb python3-tk build-essential perl libsdl2-dev
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg sdl2
      - name: Check out pinned PodBox engine source
        if: hashFiles('scripts/build_podbox.py') != ''
        uses: actions/checkout@v4
        with:
          repository: anthonyfletcher/podbox
          ref: f0850c4647e7c1cfde11ffc89ab40b55f8aa5635
          path: build/podbox-source
          persist-credentials: false
      - name: Set up Windows native compiler
        if: runner.os == 'Windows' && hashFiles('scripts/build_podbox.py') != ''
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make perl mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-SDL2
      - name: Build PodBox engines and host codecs (Windows)
        if: runner.os == 'Windows' && hashFiles('scripts/build_podbox.py') != ''
        shell: msys2 {0}
        run: python scripts/build_podbox.py --source build/podbox-source
      - name: Build PodBox engines and host codecs
        if: runner.os != 'Windows' && hashFiles('scripts/build_podbox.py') != ''
        run: python scripts/build_podbox.py --source build/podbox-source
      - name: Verify native PodBox operations and recovery on temporary fixtures
        if: hashFiles('scripts/build_podbox.py') != ''
        run: python -m unittest discover -s tests -p test_podbox_tools.py -v
      - name: Lint
        run: python -m ruff check rockbox_manager tests scripts
      - name: Build and verify extracted downloads (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" python scripts/build_app.py --release-tag "$RELEASE_TAG"
      - name: Build and verify extracted downloads
        if: runner.os != 'Linux' && (env.SIGN_MACOS != '1' || hashFiles('scripts/macos_signing.py') == '')
        shell: bash
        run: python scripts/build_app.py --release-tag "$RELEASE_TAG"
      - name: Build, notarize and verify signed macOS downloads
        if: env.SIGN_MACOS == '1' && hashFiles('scripts/macos_signing.py') != ''
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/build_app.py --release-tag "$RELEASE_TAG" --sign-macos
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-reports-${{ matrix.target }}
          path: build/reports/*.json
          if-no-files-found: ignore

  publish:
    name: Attach verified release downloads
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-reports-*
          path: release-reports
      - name: Require verified Developer ID downloads for this release recipe
        if: hashFiles('scripts/check_release_assets.py') != ''
        run: python scripts/check_release_assets.py --downloads release-assets --reports release-reports
      - name: Include the existing source ZIP format
        run: |
          git archive --format=zip --prefix="rockbox-library-manager-${RELEASE_TAG}/" \
            --output="release-assets/rockbox-library-manager-${RELEASE_TAG}.zip" HEAD
          cd release-assets
          sha256sum "rockbox-library-manager-${RELEASE_TAG}.zip" > "rockbox-library-manager-${RELEASE_TAG}.zip.sha256"
      - name: Attach builds and checksums to the existing release
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
